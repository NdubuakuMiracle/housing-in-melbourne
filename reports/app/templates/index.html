<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Melbourne House Price Predictor</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
  <style>
    html, body {
      margin:0; padding:0; height:100%;
      background: linear-gradient(135deg, #1c1c2b, #2c3e50);
      font-family: 'Segoe UI', sans-serif;
      color:#fff;
      display:flex; align-items:center; justify-content:center;
    }
    .glass-card {
      background: rgba(255,255,255,0.05);
      backdrop-filter: blur(12px);
      border:1px solid rgba(255,255,255,0.1);
      box-shadow:0 6px 20px rgba(0,0,0,0.3);
      border-radius:16px;
      width:90%; max-width:480px;
      padding:24px 16px;
      min-height:60vh;      /* ← ensures room for form + result */
      display:flex;
      flex-direction:column;
      justify-content:space-between;
    }
    h1 {
      font-size:1.6rem; margin-bottom:8px; text-align:center;
    }
    p.subtitle {
      font-size:0.9rem; color:#bbb; text-align:center; margin-bottom:16px;
    }
    label {
      margin-top:12px; font-weight:500;
    }
    input, select {
      width:100%; padding:8px; margin-top:4px;
      border-radius:8px; border:1px solid #444;
      background:#1e1e2e; color:#fff; font-size:0.9rem;
    }
    select option { background:#1e1e2e; color:#fff; }
    input:focus, select:focus { outline:none; box-shadow:0 0 4px rgba(0,198,255,0.5); }
    button {
      display: block;
      width: 60%;
      max-width: 220px;
      margin: 8px auto;
      padding: 10px 0;
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.4);
      color: #fff;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 8px;
      transition: background 0.2s ease, transform 0.2s ease;
    }

    button:hover {
      background: rgba(255, 255, 255, 0.25);
      transform: translateY(-2px);
    }
    .result-box {
      background: rgba(255,255,255,0.08);
      border-left:4px solid #00ffab;
      padding:16px; border-radius:8px;
      animation:fadeSlideIn .6s ease-in;
      margin-top:16px;
    }
    .result-box h4 { margin:0 0 6px; color:#adf7d1; font-size:1rem; }
    .result-box p  { margin:0; font-size:1.3rem; font-weight:600; }
    .footer { text-align:center; margin-top:16px; font-size:0.8rem; color:#999; }
    @keyframes fadeSlideIn {
      from { opacity:0; transform:translateY(10px); }
      to   { opacity:1; transform:translateY(0); }
    }
  </style>
</head>
<body>
  <div class="glass-card">
    <div>
      <h1>Melbourne House Price Predictor</h1>
      <p class="subtitle">Enter details to estimate house value</p>
      <form method="POST">
        <label for="suburb">Suburb</label>
        <select name="suburb" required>
          {% for suburb in suburbs %}
            <option value="{{ suburb }}" {% if suburb==input_suburb %}selected{% endif %}>
              {{ suburb }}
            </option>
          {% endfor %}
        </select>

        <label for="area">Building Area (sqm)</label>
        <input type="number" name="area" min="10" step="1"
               value="{{ input_area }}" required/>

        <label for="latitude">Latitude</label>
        <input type="number" name="latitude" step="0.0001"
               value="{{ input_lat }}" required/>

        <label for="longitude">Longitude</label>
        <input type="number" name="longitude" step="0.0001"
               value="{{ input_lon }}" required/>

        <button type="submit">Predict Price</button>
      </form>
    </div>

    {% if prediction %}
    <div class="result-box">
      <h4>Estimated Price</h4>
      <p>${{ prediction }}</p>
    </div>
    {% endif %}

    <div class="footer">Developed by Ndubuaku Miracle O.</div>
  </div>
</body>
</html>
